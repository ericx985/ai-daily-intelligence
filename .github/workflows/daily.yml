name: AI Daily Intelligence

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run intelligence collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py
      
      - name: Commit and push reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ reports/
          git diff --staged --quiet || git commit -m "📊 Daily AI Intelligence Report - $(date -u +%Y-%m-%d)"
          git push
      
      - name: Keep repository alive
        run: |
          date -u +%Y-%m-%d > .last_run
          git add .last_run
          git diff --staged --quiet || git commit -m "🤖 Keep alive - $(date -u +%Y-%m-%d)"
          git push
